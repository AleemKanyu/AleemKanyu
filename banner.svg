<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win { fill: #0a0c10; stroke: #262c36; stroke-width: 1; }
      .bar { fill: #14171d; }
      .dot { r: 5; }
      .prompt { fill: #565f6b; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .cmd { fill: #e6edf3; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .out { fill: #7ee787; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .accent { fill: #7c8cff; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; font-weight: bold; }
      .phoneBody { fill: none; stroke: #7c8cff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 760; }
      .icon { fill: #05060a; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 18px; font-weight: bold; }
    </style>

    <clipPath id="clip1"><rect id="r1" x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clip2"><rect id="r2" x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clip3"><rect id="r3" x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clip4"><rect id="r4" x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clip5"><rect id="r5" x="0" y="0" width="0" height="20"/></clipPath>
  </defs>

  <!-- master loop fade, wraps everything so the reset is invisible -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.88;0.93;0.97;1" dur="6s" repeatCount="indefinite"/>

    <!-- terminal panel -->
    <rect x="1" y="1" width="480" height="258" rx="10" class="win"/>
    <rect x="1" y="1" width="480" height="30" rx="10" class="bar"/>
    <rect x="1" y="16" width="480" height="15" class="bar"/>
    <circle cx="20" cy="16" class="dot" fill="#ff5f57"/>
    <circle cx="38" cy="16" class="dot" fill="#febc2e"/>
    <circle cx="56" cy="16" class="dot" fill="#28c840"/>

    <g class="prompt">
      <g clip-path="url(#clip1)">
        <text x="20" y="66">~ $ <tspan class="cmd">whoami</tspan></text>
      </g>
      <rect x="0" y="50" width="0" height="24" fill="none">
        <animate href="#r1" attributeName="width" values="0;190;190;190" keyTimes="0;0.06;0.9;1" dur="6s" repeatCount="indefinite"/>
        <animate href="#r1" attributeName="x" values="0;0" dur="6s" repeatCount="indefinite"/>
        <animate href="#r1" attributeName="y" values="50;50" dur="6s" repeatCount="indefinite"/>
        <animate href="#r1" attributeName="height" values="24;24" dur="6s" repeatCount="indefinite"/>
      </rect>

      <g clip-path="url(#clip2)">
        <text x="20" y="92" class="out">aleem · dev · builds mobile</text>
      </g>
      <rect id="r2host" fill="none">
        <animate href="#r2" attributeName="x" values="0;0" dur="6s" repeatCount="indefinite"/>
        <animate href="#r2" attributeName="y" values="76;76" dur="6s" repeatCount="indefinite"/>
        <animate href="#r2" attributeName="height" values="24;24" dur="6s" repeatCount="indefinite"/>
        <animate href="#r2" attributeName="width" values="0;280;280;280" keyTimes="0;0.15;0.9;1" dur="6s" begin="0.05s" repeatCount="indefinite"/>
      </rect>

      <g clip-path="url(#clip3)">
        <text x="20" y="132">~ $ <tspan class="cmd">./gradlew build</tspan></text>
      </g>
      <rect fill="none">
        <animate href="#r3" attributeName="x" values="0;0" dur="6s" repeatCount="indefinite"/>
        <animate href="#r3" attributeName="y" values="116;116" dur="6s" repeatCount="indefinite"/>
        <animate href="#r3" attributeName="height" values="24;24" dur="6s" repeatCount="indefinite"/>
        <animate href="#r3" attributeName="width" values="0;220;220;220" keyTimes="0;0.3;0.9;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
      </rect>

      <g clip-path="url(#clip4)">
        <text x="20" y="158" class="out">&gt; compiling PocketCraft...</text>
      </g>
      <rect fill="none">
        <animate href="#r4" attributeName="x" values="0;0" dur="6s" repeatCount="indefinite"/>
        <animate href="#r4" attributeName="y" values="142;142" dur="6s" repeatCount="indefinite"/>
        <animate href="#r4" attributeName="height" values="24;24" dur="6s" repeatCount="indefinite"/>
        <animate href="#r4" attributeName="width" values="0;250;250;250" keyTimes="0;0.42;0.9;1" dur="6s" begin="0.9s" repeatCount="indefinite"/>
      </rect>

      <text x="20" y="184" class="accent" opacity="0">
        &gt; BUILD SUCCESSFUL
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <text x="20" y="224">~ $ <tspan fill="#e6edf3">_</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- traveling pulse from terminal to phone -->
    <circle r="5" fill="#7c8cff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.63;0.65" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;0;1;1" keyTimes="0;0.5;0.53;0.65;1" calcMode="linear" path="M 470 175 L 700 130"/>
    </circle>


  </g>
</svg>
