<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win { fill: #0a0c10; stroke: #262c36; stroke-width: 1; }
      .bar { fill: #14171d; }
      .dot { r: 5; }
      .prompt { fill: #565f6b; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .cmd { fill: #e6edf3; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .out { fill: #7ee787; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; }
      .accent { fill: #7c8cff; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 15px; font-weight: bold; }
      .line { opacity: 0; }
      .phoneBody { fill: none; stroke: #7c8cff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 760; stroke-dashoffset: 760; }
      .screenGlow { fill: #7c8cff; opacity: 0; }
      .icon { fill: #05060a; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 18px; font-weight: bold; opacity: 0; }
    </style>
  </defs>

  <!-- terminal panel -->
  <rect x="1" y="1" width="480" height="258" rx="10" class="win"/>
  <rect x="1" y="1" width="480" height="30" rx="10" class="bar"/>
  <rect x="1" y="16" width="480" height="15" class="bar"/>
  <circle cx="20" cy="16" class="dot" fill="#ff5f57"/>
  <circle cx="38" cy="16" class="dot" fill="#febc2e"/>
  <circle cx="56" cy="16" class="dot" fill="#28c840"/>

  <g class="prompt">
    <text x="20" y="66" class="line">~ $ <tspan class="cmd">whoami</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="20" y="92" class="line out">aleem · dev · builds mobile
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    </text>

    <text x="20" y="132" class="line">~ $ <tspan class="cmd">./gradlew build</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="20" y="158" class="line out">&gt; compiling PocketCraft...
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/>
    </text>
    <text x="20" y="184" class="line accent">&gt; BUILD SUCCESSFUL
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    </text>

    <text x="20" y="224" class="line">~ $ <tspan fill="#e6edf3">_</tspan>
      <animate attributeName="opacity" values="0;1;0;1" dur="1.2s" begin="3.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- phone panel -->
  <g transform="translate(560, 20)">
    <path class="phoneBody" d="M 30 0
      H 190
      A 30 30 0 0 1 220 30
      V 190
      A 30 30 0 0 1 190 220
      H 30
      A 30 30 0 0 1 0 190
      V 30
      A 30 30 0 0 1 30 0 Z">
      <animate attributeName="stroke-dashoffset" values="760;0" dur="1.4s" begin="0.1s" fill="freeze"/>
    </path>

    <rect x="14" y="14" width="192" height="192" rx="16" class="screenGlow">
      <animate attributeName="opacity" values="0;0.12" dur="0.6s" begin="1.6s" fill="freeze"/>
    </rect>

    <rect x="80" y="90" width="60" height="60" rx="14" fill="#7c8cff" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
      <animate attributeName="y" values="100;90" dur="0.4s" begin="2s" fill="freeze"/>
    </rect>
    <text x="110" y="126" text-anchor="middle" class="icon">PC
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/>
    </text>
  </g>
</svg>
